definitions:
  domain.RegisterUserPayload:
    properties:
      age:
        maximum: 100
        minimum: 14
        type: integer
      email:
        maxLength: 55
        type: string
      firstname:
        maxLength: 20
        minLength: 3
        type: string
      lastname:
        maxLength: 20
        minLength: 3
        type: string
      password:
        maxLength: 25
        minLength: 8
        type: string
      phone:
        maxLength: 15
        minLength: 9
        type: string
      username:
        maxLength: 20
        minLength: 4
        type: string
    required:
    - email
    - firstname
    - lastname
    - password
    - phone
    - username
    type: object
info:
  contact: {}
  description: This is an Api for Yolla App
  termsOfService: http://swagger.io/terms/
  title: Yolla Api
  version: 1.1.0
paths:
  /v1/users:
    get:
      consumes:
      - application/json
      description: Gets all users from db
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get all users
      tags:
      - users
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with the provided information
      parameters:
      - description: User registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: user created succesfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Register a new user
      tags:
      - users
swagger: "2.0"
